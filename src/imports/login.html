<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TileTrader • Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-orange-800 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
    <div class="bg-gradient-to-r from-blue-800 to-orange-600 p-10 text-center text-white">
      <i class="fas fa-gem text-6xl mb-4"></i>
      <h1 class="text-3xl font-bold">OrderTrail</h1>
      <p class="text-sm mt-1 opacity-90">Premium Route2Cash Platform • 2025</p>
    </div>
    <div class="p-10">
      <form id="loginForm" class="space-y-6">
        <input type="text" id="username" placeholder="Username" value="admin" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500">
        <input type="password" id="password" placeholder="Password" value="tiles2025" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500">
        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-orange-600 to-orange-700 hover:from-orange-700 hover:to-orange-800 text-white font-bold rounded-lg shadow-lg">Login</button>
      </form>
      <p class="text-center text-xs text-gray-500 mt-6">Demo: admin / tiles2025</p>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').onsubmit = e => {
      e.preventDefault();
      if (e.target.username.value === 'admin' && e.target.password.value === 'tiles2025') {
        localStorage.setItem('isLoggedIn', 'true');
        location.href = 'index.html';
      } else alert('Wrong credentials');
    };
  </script>
</body>
</html>
